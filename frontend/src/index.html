<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PosFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  </head>
<body>
  <div class="boot-splash" id="bootSplash" aria-hidden="true">
    <div class="boot-line">
      <img src="assets/images/full.png" alt="Geetanjali Salon" class="splash-logo">
      <span class="boot-rule"></span>
    </div>
  </div>

  <script>
    setTimeout(() => {
      const splash = document.getElementById('bootSplash');
      if (splash) {
        splash.classList.add('is-leaving');
        setTimeout(() => splash.classList.add('is-gone'), 1100);
      }
    }, 3700);
  </script>

  <app-root></app-root>
</body>
</html>
