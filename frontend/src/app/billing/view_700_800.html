        </div>
        <div class="summary-row" style="color: var(--text-primary);">
          Rounding: {{ roundingAmount | number:'1.2-2' }}
        </div>
        <div class="summary-row total-row">
          Total Invoice Amount: Rs. {{ finalTotalAmount | number:'1.2-2' }}
        </div>
        

      </div>

      <div class="invoice-actions">
        <button class="btn-discard" (click)="holdCurrentCart()" *ngIf="cart.length > 0 && currentInvoiceStatus === 'draft'" style="background: var(--warning, #f59e0b); color: white; border-color: var(--warning, #f59e0b);">Hold Cart</button>
        <button class="btn-discard" (click)="discardInvoice()">Discard</button>
        <button class="btn-save" (click)="saveInvoice(true)" *ngIf="currentInvoiceStatus === 'draft'">SAVE</button>
        <button class="btn-finalise" *ngIf="cart.length > 0 && currentInvoiceStatus === 'draft'" (click)="openCheckoutModal()"><i class="fa fa-check-circle" style="margin-right:8px;"></i>Finalise [F2]</button>
      </div>
    </div>
  </div>




<!-- Toast Notification -->
<div class="toast-notification" [class.show]="toastVisible" [ngClass]="toastType">
  <i class="fa" [ngClass]="{'fa-check-circle': toastType === 'success', 'fa-exclamation-circle': toastType === 'error', 'fa-info-circle': toastType === 'info'}" style="margin-right: 8px;"></i>
  {{ toastMessage }}
</div>

        </div>
      </div>

      <h4 style="margin-top: 0; font-size: 13px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;">Split Payments</h4>
      
      <div *ngFor="let p of checkoutPayments; let i = index" style="margin-bottom: 16px;">

          <select [(ngModel)]="p.method" (ngModelChange)="calcCheckoutRemaining()" style="flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg-card); color: var(--text-primary); outline: none;">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="UPI">UPI</option>
            <option value="Cheque">Cheque</option>
            <option value="Advance">Advance/Wallet (Bal: Rs. {{clientAdvanceBalance}})</option>
            <option *ngFor="let vc of client?.active_value_cards" [value]="'Value Card ' + vc.id">

            </option>

          <div style="position: relative; flex: 1;">

          <button (click)="p.amount = checkoutRemaining + (p.amount || 0); calcCheckoutRemaining()" style="padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-primary); cursor: pointer;">Exact</button>
          <button (click)="p.amount = 500; calcCheckoutRemaining()" style="padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-primary); cursor: pointer;">₹500</button>
          <button (click)="p.amount = 1000; calcCheckoutRemaining()" style="padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-primary); cursor: pointer;">₹1000</button>
          <button (click)="p.amount = 2000; calcCheckoutRemaining()" style="padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-primary); cursor: pointer;">₹2000</button>
        </div>
      </div>

      <button (click)="addPaymentRow()" style="background: transparent; border: 1px dashed var(--border-strong, #c7cad3); width: 100%; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-secondary); font-weight: 600; font-size: 12.5px; margin-bottom: 24px; transition: all 0.2s;" onmouseover="this.style.background='var(--bg-subtle)'; this.style.color='var(--ink)'" onmouseout="this.style.background='transparent'; this.style.color='var(--text-secondary)'">

      </div>
    </div>
