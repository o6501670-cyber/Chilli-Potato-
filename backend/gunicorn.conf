[program:pos_backend]
# Supervisor config. It is intentionally relative to this directory so the
# service is deployable without editing a developer's absolute path.
directory=%(here)s
command=%(here)s/.venv/bin/gunicorn pos_backend.wsgi:application --config %(here)s/gunicorn.conf.py
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/pos_backend.log
